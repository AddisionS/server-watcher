<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="temper">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ServerWatcher</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      background-color: #121418; /* Matches your AppTheme background */
      margin: 0;
      overflow: hidden;
    }
    #loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121418;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out; /* Smooth fade out */
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #1C1F26; /* Dark Card Color */
      border-top: 4px solid #3B82F6; /* Electric Blue */
      border-right: 4px solid #2ECA8B; /* Neon Green */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loader-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: #F8F9FA; /* Crisp White */
      letter-spacing: 0.5px;
    }
    .loader-text span {
      color: #2ECA8B; /* Neon Green */
    }
  </style>
</head>
<body class="light">
  <div id="loader-container">
    <div class="spinner"></div>
    <div class="loader-text">Server<span>-Watcher</span></div>
  </div>

  <!-- Force HTML renderer BEFORE bootstrap loads -->
  <script>
    window.flutterConfiguration = {
      renderer: "html"
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <!-- Hide loader when Flutter renders first frame -->
  <script>
        window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loader-container');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
